<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      // Portal do Aluno (portal.* ou /aluno) = app instalável (PWA). O CRM não ganha manifest.
      (function () {
        if (!/^portal\./i.test(location.hostname) && !/^\/(aluno|atendimento)/.test(location.pathname)) return
        var h = document.head
        // iPhone dá zoom sozinho ao tocar num campo com letra < 16px (login do CPF) e a página
        // fica ampliada depois: rolagem lateral e menu de baixo fora da tela. maximum-scale=1 evita
        // esse zoom automático (o iOS continua deixando ampliar com os dedos).
        var vp = document.querySelector('meta[name=viewport]')
        if (vp) vp.setAttribute('content', 'width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover')
        function add(tag, attrs) { var el = document.createElement(tag); for (var k in attrs) el.setAttribute(k, attrs[k]); h.appendChild(el) }
        add('link', { rel: 'manifest', href: '/pwa/manifest.webmanifest' })
        add('link', { rel: 'apple-touch-icon', href: '/pwa/apple-touch-icon.png' })
        add('link', { rel: 'icon', type: 'image/png', href: '/pwa/icon-192.png' })
        add('meta', { name: 'theme-color', content: '#13161D' })
        add('meta', { name: 'apple-mobile-web-app-capable', content: 'yes' })
        add('meta', { name: 'mobile-web-app-capable', content: 'yes' })
        add('meta', { name: 'apple-mobile-web-app-status-bar-style', content: 'black' })
        add('meta', { name: 'apple-mobile-web-app-title', content: 'FICV Aluno' })
        document.title = 'Portal do Aluno | FICV'
        if ('serviceWorker' in navigator) window.addEventListener('load', function () { navigator.serviceWorker.register('/sw-aluno.js', { scope: /^portal\./i.test(location.hostname) ? '/' : '/aluno' }).catch(function () {}) })
      })()
    </script>
    <title>SalesPulse | Inteligência Comercial</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
