name: Sync Meta Ads → Supabase

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      date_preset:
        description: 'Período (last_7d, last_30d, last_90d)'
        default: 'last_90d'
        required: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Sync Meta Ads → Supabase
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          INPUT_DATE_PRESET: ${{ github.event.inputs.date_preset }}
        run: node scripts/sync-meta-ads.mjs "${INPUT_DATE_PRESET:-last_90d}"
