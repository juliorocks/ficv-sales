name: Sync Sponte → SurrealDB

on:
  schedule:
    # 08h, 13h, 17h, 21h horário de Brasília (UTC-3)
    - cron: '0 11,16,20,0 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Modo de sync'
        default: 'full'
        required: false
      start_date:
        description: 'Data início (YYYY-MM-DD)'
        required: false
      end_date:
        description: 'Data fim (YYYY-MM-DD)'
        required: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Sync Sponte → SurrealDB
        env:
          SURREAL_ENDPOINT: https://heroic-quelea-06frhjc9ott4l61s0fs8nn630s.aws-use2.surreal.cloud
          SURREAL_USER: ficv_admin
          SURREAL_PASS: ${{ secrets.SURREAL_PASS }}
        run: |
          node scripts/sync-sponte.mjs \
            "${{ github.event.inputs.mode || 'full' }}" \
            "${{ github.event.inputs.start_date || '' }}" \
            "${{ github.event.inputs.end_date || '' }}"
