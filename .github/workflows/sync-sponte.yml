name: Sync Sponte → SurrealDB + Supabase

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Modo de sync'
        default: 'full'
        required: false
      start_date:
        description: 'Data início (YYYY-MM-DD) — vazio = últimos 3 dias'
        required: false
      end_date:
        description: 'Data fim (YYYY-MM-DD) — vazio = hoje'
        required: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Sync Sponte → SurrealDB + Supabase
        env:
          SURREAL_ENDPOINT: https://heroic-quelea-06frhjc9ott4l61s0fs8nn630s.aws-use2.surreal.cloud
          SURREAL_USER: ficv_admin
          SURREAL_PASS: ${{ secrets.SURREAL_PASS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          INPUT_START: ${{ github.event.inputs.start_date }}
          INPUT_END: ${{ github.event.inputs.end_date }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
        run: |
          # Cron horária usa últimos 3 dias; execução manual usa datas fornecidas
          # Valores vêm por variável de ambiente, nunca interpolados no script (injeção de shell)
          if [[ -n "$INPUT_START" && ! "$INPUT_START" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then echo "start_date inválida"; exit 1; fi
          if [[ -n "$INPUT_END" && ! "$INPUT_END" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then echo "end_date inválida"; exit 1; fi
          case "${INPUT_MODE:-full}" in full|matriculas|parcelas) ;; *) echo "mode inválido"; exit 1;; esac
          START_DATE="${INPUT_START:-$(date -d '3 days ago' +%Y-%m-%d)}"
          END_DATE="${INPUT_END:-$(date +%Y-%m-%d)}"
          echo "Sincronizando $START_DATE → $END_DATE"
          node scripts/sync-sponte.mjs \
            "${INPUT_MODE:-full}" \
            "$START_DATE" \
            "$END_DATE"
